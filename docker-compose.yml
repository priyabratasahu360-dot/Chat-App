version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - redis
  
  frontend:
    build: ./frontend
    ports:
     - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine #lightweight image
    ports:
      - "6379:6379"
    